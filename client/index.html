<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 인게임 풀스크린 · Safe Area 미침범 (앱인토스 검수 요건) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F3E9DC" />
    <!-- 서체 — Pretendard(본문) · Jua(타이틀). 둘 다 무료 라이선스다.
         지금은 CDN에서 받는다. 최초 화면 10초 제한이 있어 preconnect를 먼저 걸고
         swap으로 글자가 먼저 나오게 한다.
         출시 전에는 self-host 해야 한다 — 번들을 자체 완결적으로 두는 편이
         낫고(파비콘도 같은 이유로 인라인이다) 외부 CDN은 런타임 의존이다.
         docs/deployment.md 참고 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Jua&display=swap"
    />
    <!-- 인라인 파비콘. 외부 파일을 두지 않아 번들이 자체 완결적이고,
         지정하지 않으면 브라우저가 /favicon.ico를 찾다 404를 남긴다 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23C4622D'/%3E%3Ctext x='16' y='23' font-size='19' font-family='sans-serif' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3E초%3C/text%3E%3C/svg%3E"
    />
    <title>초성배틀</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
